<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X to Nitter Redirector</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
    }
    input {
      width: 80%;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 10px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    p {
      color: #555;
      font-size: 14px;
    }
  </style>
  <script>
    const instances = [
  "https://nitter.catsarch.com",
  "https://nitter.tiekoetter.com",
  "https://shitter.thepixora.com",
  "https://nitter.mie.foundation",
  "https://shi.meowing.de",
  "https://xnologin.com",
  "https://ruf.st",
  "https://nitter.netbub.com",
  "https://nitter.click",
  "https://nitter.xitter.cc",
  "https://nitterts.pages.dev",
  "https://nitter.miningtcup.me"
]


    // स्मार्ट शफल लॉजिक: जब तक पांचों सर्वर एक-एक बार यूज नहीं हो जाते, तब तक कोई भी रिपीट नहीं होगा
    function getNextServer() {
      let pool = [];
      try {
        pool = JSON.parse(localStorage.getItem("nitter_pool")) || [];
      } catch (e) {
        pool = [];
      }

      const lastUsed = localStorage.getItem("nitter_last");

      if (pool.length === 0) {
        pool = [...instances];
        // Fisher-Yates Shuffle (Cryptographic Random के साथ)
        for (let i = pool.length - 1; i > 0; i--) {
          const rand = new Uint32Array(1);
          window.crypto.getRandomValues(rand);
          const j = rand[0] % (i + 1);
          [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        // अगर नया पूल बनने पर अगला सर्वर वही है जो पिछली बार खुला था, तो उसे बदल दें
        if (pool.length > 1 && pool[pool.length - 1] === lastUsed) {
          [pool[pool.length - 1], pool[0]] = [pool[0], pool[pool.length - 1]];
        }
      }

      const selected = pool.pop();
      try {
        localStorage.setItem("nitter_pool", JSON.stringify(pool));
        localStorage.setItem("nitter_last", selected);
      } catch (e) {}

      return selected;
    }

    function getRedirectUrl(input) {
      let clean = input.trim();
      if (!clean) return null;

      // x.com या twitter.com हटाकर सिर्फ आगे का path निकालना
      clean = clean.replace(/^(https?:\/\/)?(www\.)?(x\.com|twitter\.com)\/?/i, "");
      clean = clean.replace(/^\/+/, "");

      const randomServer = getNextServer();
      return `${randomServer}/${clean}`;
    }

    // Direct URL Parameter Redirect (?url=x.com/david या ?x.com/david)
    const params = new URLSearchParams(window.location.search);
    const targetParam = params.get("url") || window.location.search.substring(1);

    if (targetParam) {
      const destination = getRedirectUrl(decodeURIComponent(targetParam));
      if (destination) {
        window.location.replace(destination);
      }
    }

    function manualRedirect(e) {
      e.preventDefault();
      const val = document.getElementById("urlInput").value;
      const destination = getRedirectUrl(val);
      if (destination) {
        // नए टैब (दूसरे पेज) में ओपन करने के लिए
        window.open(destination, "_blank", "noopener,noreferrer");
      }
    }
  </script>
</head>
<body>
  <h2>X to Nitter Redirect</h2>
  <form onsubmit="manualRedirect(event)">
    <input type="text" id="urlInput" placeholder="x.com/david या सिर्फ david डालें" required autofocus>
    <br>
    <button type="submit">Redirect</button>
  </form>
  <p>Direct Redirect: <code>?url=x.com/david</code></p>
</body>
</html>
